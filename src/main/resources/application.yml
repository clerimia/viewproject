# ============================================================
# RAG 检索服务连接（外部依赖）
# ============================================================
rag:
  base-url: ${RAG_BASE_URL:http://localhost:8081}
  username: ${RAG_USERNAME:admin}
  password: ${RAG_PASSWORD:}

app:
  admin:
    init-enabled: ${ADMIN_INIT_ENABLED:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    balance: ${ADMIN_BALANCE:100000}
    reset-password: ${ADMIN_RESET_PASSWORD:false}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:3b}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ai_cust?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

# ============================================================
# 语音服务配置
# ============================================================
speech:
  tts:
    default-voice: zh-CN-XiaoxiaoNeural
    default-rate: "+0%"
    edge-tts-bin: ${EDGE_TTS_BIN:edge-tts}
  asr:
    whisper-model: models/ggml-small.bin
